name: Integration
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  anti-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install networking tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 iputils-ping
      - name: Qualify generated ruleset
        run: sudo sh tests/integration/check_renderer.sh
      - name: Qualify external gateway discovery and fail-closed removal
        run: sh tests/integration/gateway_discovery.sh
      - name: Run anti-bypass namespace qualification
        run: sudo sh tests/integration/anti_bypass.sh
      - name: Qualify proxied dataplane path
        run: sudo sh tests/integration/dataplane_proxy.sh
      - name: Qualify pag-dns end-to-end
        run: sudo sh tests/integration/dns_gateway.sh
